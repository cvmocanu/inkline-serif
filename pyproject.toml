[project]
name = "inkline-serif"
version = "0.1.0"
description = "Domine, emboldened, hinted and slanted to read better on e-ink"
authors = [
    { name = "Cristian Mocanu", email = "cvmocanu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fonttools==4.65.0",
    "freetype-py==2.5.1",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "skia-pathops==0.9.2",
    "ttfautohint-py==0.6.1",
]

[project.scripts]
inkline-build = "inkline_serif.build:main"
inkline-measure = "inkline_serif.measure:main"
inkline-preview = "inkline_serif.preview:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly==1.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.pytest]
strict = true
testpaths = ["tests"]

[tool.pyrefly]
preset = "strict"
# The tests import their helper modules by their bare names, as pytest puts tests/ on the path.
search-path = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
